<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Luces · FAA! 2026</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Tu teléfono es parte del show: se ilumina con la música.">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#F4F7D9;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#10130D;text-align:center}
.ov[hidden]{display:none}
.box{max-width:380px;display:grid;gap:16px;justify-items:center}
.box h1{font:900 34px/1.05 system-ui;letter-spacing:-.01em}
.box h1 em{font-style:normal;color:#FF2E6A}
.box p{color:#A6AD9B;font-size:15.5px}
.box ol{color:#ECEEE5;text-align:left;font-size:15.5px;padding-left:22px;display:grid;gap:6px}
.go{border:0;border-radius:999px;padding:15px 30px;font:800 18px system-ui;background:#FF2E6A;color:#fff}
.go[disabled]{opacity:.6}
.warn{font-size:12.5px;color:#6B7266}
.status{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(16,19,13,.6);color:#A6AD9B;font:600 12.5px system-ui;transition:opacity 1s}
.status.dim{opacity:0}
.dot{width:9px;height:9px;border-radius:50%;background:#93CC6E;transform:scale(var(--lv,1))}
.picker{position:fixed;inset:auto 0 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(16,19,13,.92)}
.picker[hidden]{display:none}
.picker button{border:1px solid #2F3529;background:#191D15;color:#ECEEE5;border-radius:12px;padding:10px 4px;font:700 13px system-ui}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="status" id="status"><span class="dot" id="dot"></span><span id="stxt">Escuchando…</span></div>
<div class="picker" id="picker" hidden></div>
<div class="ov" id="ov">
  <div class="box">
    <h1>Luces <em>FAA!</em></h1>
    <p>Tu teléfono es parte del show: se va a iluminar con la música.</p>
    <ol>
      <li>Subí el brillo al máximo.</li>
      <li>Tocá <b>Entrar</b> y aceptá el micrófono (solo escucha las señales del show, no graba nada).</li>
      <li>Dejá esta pantalla abierta y levantá el teléfono.</li>
    </ol>
    <button class="go" id="go" type="button">Entrar</button>
    <p class="warn" id="warn">Incluye luces intermitentes.</p>
  </div>
</div>
<script src="vendor/ggwave.js"></script>
<script src="app.js?v=1"></script>
</body>
</html>
